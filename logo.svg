<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Spain run viewer logo">
  <!-- Run viewer logo: a dark tile with a grid, the real price (grey, jagged) and the model price
       (turquoise, the site's model colour) ending in a node, like a bus in the grid model -->
  <rect width="64" height="64" rx="14" fill="#1b1f24"/>
  <path d="M10 20h44M10 32h44M10 44h44" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <polyline points="9,41 15,33 20,45 27,24 33,38 40,20 46,31 52,25" fill="none" stroke="#b3b2ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="9,45 18,37 27,39 36,29 45,27 52,21" fill="none" stroke="#26c6da" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="52" cy="21" r="5.5" fill="#1b1f24" stroke="#26c6da" stroke-width="3"/>
  <circle cx="52" cy="21" r="1.8" fill="#ffffff"/>
</svg>
